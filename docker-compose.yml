version: '3.8'

services:
  tv-ai-voice:
    build:
      context: .
      dockerfile: Dockerfile
    
    container_name: tv-ai-voice-app
    
    ports:
      - "80:80"
      # 如果需要 HTTPS，取消注释下一行
      # - "443:443"
    
    restart: always
    
    environment:
      - NODE_ENV=production
    
    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # 资源限制（可选）
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.5'
    #       memory: 256M
